name: iOS Quality

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  XCODE_VERSION: "16.2"
  PROJECT: AIChat.xcodeproj
  SCHEME: AIChat
  DERIVED_DATA_PATH: .derivedData
  SPM_CACHE_PATH: .spm
  PACKAGE_RESOLVED_PATH: AIChat.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install SwiftLint if needed
        run: |
          set -euo pipefail

          if command -v swiftlint >/dev/null 2>&1; then
            swiftlint version
            exit 0
          fi

          brew install swiftlint
          swiftlint version

      - name: Run SwiftLint
        run: |
          set -euo pipefail
          swiftlint --config AIChat/.swiftlint.yml

  unit-tests:
    name: Build and unit tests
    runs-on: macos-15
    timeout-minutes: 30
    needs: lint

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE_PATH }}
          key: ${{ runner.os }}-spm-${{ env.XCODE_VERSION }}-${{ hashFiles(env.PACKAGE_RESOLVED_PATH) }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ env.XCODE_VERSION }}-

      - name: Prepare Xcode project
        uses: ./.github/actions/prepare-xcode-project
        with:
          xcode-version: ${{ env.XCODE_VERSION }}
          project: ${{ env.PROJECT }}
          scheme: ${{ env.SCHEME }}
          spm-cache-path: ${{ env.SPM_CACHE_PATH }}

      - name: Select simulator destination
        id: simulator
        run: |
          set -euo pipefail
          ./.github/scripts/select-simulator.sh "$PROJECT" "$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Build for testing
        run: |
          set -euo pipefail

          xcodebuild build-for-testing \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          set -euo pipefail

          xcodebuild test-without-building \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" \
            -only-testing:AIChatTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-test-artifacts
          path: |
            .derivedData/Logs/Test/*.xcresult
            .derivedData/Logs/Build/*
          if-no-files-found: ignore
